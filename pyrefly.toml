preset = "strict"
python-version = "3.11"
project-includes = ["src", "adapters/onebot/src"]
project-excludes = ["logic.py"]
search-path = ["src", "adapters/onebot/src"]

[errors]
# 存量代码缺类型注解/泛型参数的噪音，暂不补注解，静音处理
implicit-any-type-argument = false
implicit-any-parameter = false
implicit-any-empty-container = false
implicit-any-lambda = false
implicit-any-attribute = false
