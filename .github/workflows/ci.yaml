name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyrefly
        run: uv run pyrefly check

      - name: Build distributions
        run: |
          uv build --package hyper-bot --out-dir dist/core
          uv build --package hyperot-adapter-onebot --out-dir dist/adapter
          uv build --package hyperot-adapter-milky --out-dir dist/adapter
          uv build --package hyperot-adapter-satori --out-dir dist/adapter

      - name: Pytest
        run: uv run pytest
