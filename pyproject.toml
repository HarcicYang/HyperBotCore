[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-bot"
version = "0.90.0"
description = "稳定高效、易于开发的QQ Bot框架"
authors = [
    { name = "Harcic", email = "harcic@outlook.com" },
]
urls = { repository = "https://github.com/HarcicYang/HypeR_Bot" }
requires-python = ">=3.10"
dependencies = [
    "setuptools",
    "aiohttp~=3.9.5",
    "requests~=2.31.0",
    "httpx~=0.26.0",
    "websockets",
    "Flask~=3.0.0",
    "ucfgr>=0.0.5",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyperot*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 工作区挂载在 NTFS (fuseblk) 上，无法表示可执行位，文件总是 rwxrwxrwx。
# git index 中已通过 `git update-index --chmod=-x` 修正为 644，此处忽略该检查。
extend-per-file-ignores = { "*.py" = ["EXE002"] }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
