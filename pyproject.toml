[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-bot"
version = "2.0.0"
description = "稳定高效、易于开发的QQ Bot框架"
readme = "readme.md"
authors = [
    { name = "Harcic", email = "harcic@outlook.com" },
]
urls = { repository = "https://github.com/HarcicYang/HyperBotCore" }
requires-python = ">=3.11"
dependencies = [
    "httpx~=0.28.1",
    "websockets~=17.0.1",
    "fastapi~=0.141.1",
    "uvicorn~=0.52.0",
    "ucfgr>=0.0.5",
    "typing_extensions>=4.9",
    "pydantic>=2.11",
    "packaging>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hyperot*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 工作区挂载在 NTFS (fuseblk) 上，无法表示可执行位，文件总是 rwxrwxrwx。
# git index 中已通过 `git update-index --chmod=-x` 修正为 644，此处忽略该检查。
extend-per-file-ignores = { "*.py" = ["EXE002"] }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyrefly>=1.2.0",
    "hyperot-adapter-onebot",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "euler_live: tests requiring a live local EulerOneBot account",
    "euler_destructive: destructive live QQ operations",
]

[tool.uv.workspace]
members = ["adapters/onebot"]

[tool.uv.sources]
hyper-bot = { workspace = true }
hyperot-adapter-onebot = { workspace = true }
